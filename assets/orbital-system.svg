<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="40%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </radialGradient>
    <linearGradient id="tailGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7ef9e9"/>
      <stop offset="100%" stop-color="#7ef9e900"/>
    </linearGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#ffd166" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredGlow"/>
      <feComponentTransfer in="coloredGlow" result="boosted">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boosted"/>
        <feMergeNode in="boosted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#4ecdc4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredGlow"/>
      <feComponentTransfer in="coloredGlow" result="boosted">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boosted"/>
        <feMergeNode in="boosted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cometGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#7ef9e9" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredGlow"/>
      <feComponentTransfer in="coloredGlow" result="boosted">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boosted"/>
        <feMergeNode in="boosted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
  @keyframes twinkle{0%{opacity:0.15} 50%{opacity:0.65} 100%{opacity:0.15}}
  .twinkle{animation-name:twinkle;animation-duration:3.5s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  @keyframes orbitCW{0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)}}
  .orbitCW{animation-name:orbitCW;animation-duration:8s;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes orbitCCW{0%{transform:rotate(-360deg)} 100%{transform:rotate(0deg)}}
  .orbitCCW{animation-name:orbitCCW;animation-duration:14s;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes orbitSlow{0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)}}
  .orbitSlow{animation-name:orbitSlow;animation-duration:22s;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes comet{0%{transform:translate(240px,240px) rotate(0deg)} 100%{transform:translate(240px,240px) rotate(-360deg)}}
  .comet{animation-name:comet;animation-duration:10s;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes breathe{0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)}}
  .breathe{animation-name:breathe;animation-duration:4s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  </style>
