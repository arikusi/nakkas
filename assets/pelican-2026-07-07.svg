<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ed4f0"/>
      <stop offset="100%" stop-color="#eaf8fd"/>
    </linearGradient>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#ffd66b" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredGlow"/>
      <feComponentTransfer in="coloredGlow" result="boosted">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="boosted"/>
        <feMergeNode in="boosted"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
  @keyframes spin{0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)}}
  .spin{animation-name:spin;animation-duration:2.5s;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes drift{0%{transform:translateX(0px)} 50%{transform:translateX(26px)} 100%{transform:translateX(0px)}}
  .drift{animation-name:drift;animation-duration:9s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  @keyframes drift2{0%{transform:translateX(0px)} 50%{transform:translateX(-20px)} 100%{transform:translateX(0px)}}
  .drift2{animation-name:drift2;animation-duration:13s;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
  </style>
